packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

minimumReleaseAge: 1440

overrides:
  '@hono/node-server': 2.0.11
  'fast-uri@3.1.3': 3.1.4
  'fast-uri@4.1.0': 4.1.1
  find-my-way: 9.7.0
  js-base64: 3.8.0
