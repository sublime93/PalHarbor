packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - deepmerge-ts@8.0.0
  - fast-uri@3.1.7
  - fast-uri@4.1.4
  - mysql2@3.23.1
  - nanoid@3.3.18
  - postcss@8.5.23
  - valibot@1.4.2

overrides:
  '@hono/node-server': 2.0.11
  'deepmerge-ts@<8.0.0': 8.0.0
  'fast-uri@>=3.0.0 <4.0.0': 3.1.7
  'fast-uri@>=4.0.0 <5.0.0': 4.1.4
  find-my-way: 9.7.0
  js-base64: 3.8.0
  'mysql2@<3.23.1': 3.23.1
  'nanoid@<3.3.18': 3.3.18
  'postcss@<8.5.23': 8.5.23
  'valibot@<1.4.2': 1.4.2
