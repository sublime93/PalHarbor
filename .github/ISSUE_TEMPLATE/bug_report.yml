name: Bug report
description: Report reproducible incorrect behavior in PalHarbor.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, public server addresses, player data, save files, or database contents.
  - type: input
    id: version
    attributes:
      label: PalHarbor version or commit
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Activity database
      options: [SQLite, PostgreSQL, Disabled]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, player information, and private server details.
          required: true
